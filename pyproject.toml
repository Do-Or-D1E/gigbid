[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 Assignment II)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "langchain-core>=1.8.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-supervisor>=0.0.31",
    "langsmith>=0.14.17",
    "mcp>=1.30.0",
    "model2vec>=0.10.0",
    "numpy>=2.4.6",
    "openai>=3.51.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "redis>=5.3.1",
    "sse-starlette>=3.7.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[dependency-groups]
dev = [
    "fastembed>=0.9.1",
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]
