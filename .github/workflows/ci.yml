name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: No secrets in the repo
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: GigSim unchanged
        run: uv run python scripts/gigsim_checksums.py --verify
      - name: Prompts only in agent/prompts
        run: uv run python scripts/check_prompts.py
      - name: README numbers trace to evals/results
        run: uv run python scripts/check_numbers.py
      - name: Lint (errors only)
        run: uv run ruff check agent apps/api rag mcp_servers worker --select E9,F63,F7,F82
      - name: Unit, contract, MCP and GigSim tests
        env: {CI: "1"}
        run: uv run pytest -q tests/unit tests/contract tests/gigsim mcp_servers
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image
        env: {APP_SECRET: ci, TOKEN_ENC_KEY: ci}
        run: docker compose -f infra/docker-compose.yml build
