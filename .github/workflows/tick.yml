name: worker-tick
# Serverless worker schedule for the Vercel deployment (Vercel Hobby cron runs only daily).
on:
  schedule: [{cron: "17 */3 * * *"}]
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS -m 290 -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ secrets.PUBLIC_BASE_URL }}/api/worker/tick"
