# GigBid runtime configuration. Every model, threshold, budget and rule source lives here,
# never in code. The active profile comes from GIGBID_PROFILE (falls back to `profile`).

profile: open

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    billed: false          # free tier, list prices below are used for cost estimates only
    structured_method: json_schema
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    billed: true
    structured_method: json_schema

# USD per 1M tokens (input, output). Groq rows are list prices used to report an
# equivalent cost; the free tier bills $0.
prices:
  openai/gpt-oss-20b: [0.10, 0.50]
  openai/gpt-oss-120b: [0.15, 0.75]
  qwen/qwen3.8-27b: [0.29, 0.59]
  gpt-4o-mini: [0.15, 0.60]
  gpt-4.1-mini: [0.40, 1.60]
  gpt-5-nano: [0.05, 0.40]

profiles:
  open:
    description: Open-weight models only, hosted by Groq (no GPU on free hosts).
    tiers:
      small: {provider: groq, model: openai/gpt-oss-20b}
      strong: {provider: groq, model: openai/gpt-oss-120b}
    fallback:
      small: {provider: groq, model: qwen/qwen3.8-27b}
      strong: {provider: groq, model: openai/gpt-oss-20b}
  open_qwen:
    description: Second open configuration for the model comparison.
    tiers:
      small: {provider: groq, model: qwen/qwen3.8-27b}
      strong: {provider: groq, model: openai/gpt-oss-120b}
    fallback:
      small: {provider: groq, model: openai/gpt-oss-20b}
      strong: {provider: groq, model: qwen/qwen3.8-27b}
  paid:
    description: Optional API profile, used only where it beats open enough to pay for.
    tiers:
      small: {provider: openai, model: gpt-4o-mini}
      strong: {provider: openai, model: gpt-4o-mini}
    fallback:
      small: {provider: openai, model: gpt-4o-mini}
      strong: {provider: openai, model: gpt-4o-mini}

# Route by node: cheap frequent nodes on the small tier, writing and judgement on strong.
nodes:
  scout: small
  analyst: small
  risk_assessor: small
  fit_matcher: small
  pricing: small
  writer: strong
  verifier: small
  critic: strong
  compliance: small
  liaison: strong
  intent: small
  judge: strong
  hyde: small
  contextualizer: small
  baseline_agent: strong

llm:
  temperature: 0.2
  timeout_s: 45
  max_retries: 2
  max_output_tokens: 1800
  # Hard cap on billed (non-free) spend, checked before every billed call.
  billed_cap_usd: 2.00
  cache_path: cache/llm_cache.sqlite   # used by evals only (GIGBID_LLM_CACHE=1)

embeddings:
  model: minishlab/potion-base-8M      # model2vec static embeddings, open (MIT), CPU only
  alt_model: BAAI/bge-small-en-v1.5    # compared in evals via fastembed (ONNX)
reranker:
  model: Xenova/ms-marco-MiniLM-L-6-v2 # open cross-encoder via fastembed (ONNX)

rag:
  variant: v2_hybrid        # replaced by the evaluated winner, see evals/results/rag_decision.json
  k: 8
  chunk_tokens: 180
  chunk_overlap: 30
  rrf_k: 60
  proof_types: [case_study, repo, review, cv, upload]   # what may ground a claim (not past proposals)
  outcome_boost: {won: 0.25, replied: 0.12, ignored: -0.05}
  corrective:
    min_grade: 0.45
    max_requeries: 1

marketplace:
  mode: gigsim              # gigsim | upwork_live
  gigsim_base_url: http://localhost:8081
  upwork_mcp_url: https://mcp.upwork.com/mcp
  max_requests_per_minute: 40   # stays under GigSim's 60/min
  timeout_s: 15
  retries: 3
  backoff_s: 0.8
  connect_usd: 0.15         # what one Connect costs the freelancer

mcp:
  transport: http           # http | inproc (inproc used on serverless and in tests)
  servers:
    portfolio: http://localhost:8101/mcp
    marketplace: http://localhost:8102/mcp
    workspace: http://localhost:8103/mcp
    github: https://api.githubcopilot.com/mcp/
  # Each agent gets only the tools it needs, filtered by name.
  allowlists:
    scout: [search_jobs, get_job]
    risk_assessor: [get_client_history]
    fit_matcher: [search_evidence, list_skills]
    pricing: [get_pricing_stats, get_connects_balance, quote_connects]
    writer: [search_evidence, get_case_study]
    critic: [search_evidence, get_case_study]
    submit: [create_proposal_draft, submit_proposal]
    liaison: [list_threads, list_messages, send_message, free_slots, create_interview_hold, create_email_draft]

policy:
  pack_dir: data/policy_pack
  version: 1                # the 2 Nov change request bumps this to 2
  not_for_drafts: [untrusted_input, fair_automation]   # enforced by design, not by scanning drafts

decision:
  min_fit_bid: 0.55
  min_fit_watch: 0.40
  max_risk_bid: 0.55
  block_risk: 0.80
  require_coverage: 0.5

pricing:
  floor_multiplier: 1.0     # never bid under the user's floor
  min_expected_value_ratio: 3.0   # expected value must be >= 3x the Connects cost in USD

writer:
  max_words: 260
  max_revisions: 2

budgets:
  max_steps_per_thread: 40
  max_tokens_per_thread: 60000
  declared:
    p95_latency_s_per_job_analysed: 40
    p95_latency_s_per_proposal: 120
    usd_per_job_analysed: 0.002
    usd_per_proposal: 0.008

autonomy:
  default: suggest          # suggest | auto_skip_low_fit (never auto-send)

scheduling:
  gigsim_scout_interval_minutes: 30
  live_scout_interval_minutes: 240   # conservative; see docs/RUNBOOK.md

memory:
  style:
    promote_after: 2        # same edit pattern seen in 2 of the last 5 edits
    window: 5
  outcome:
    min_outcomes: 3

